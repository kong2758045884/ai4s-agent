services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ai-agent-station}
      MYSQL_USER: ${MYSQL_USER:-ai4s}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./AI4S-agent-app/src/main/resources/db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
      - ./AI4S-agent-app/src/main/resources/db/data.sql:/docker-entrypoint-initdb.d/002-data.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -u root -p"$${MYSQL_ROOT_PASSWORD}" --silent
      interval: 10s
      timeout: 5s
      retries: 20

  ai4s-sandbox:
    build:
      context: .
      dockerfile: Dockerfile
      target: ai4s-tool
    restart: unless-stopped
    env_file:
      - ./ai4s-tool/.env
    environment:
      ENV: prod
      AI4S_TOOL_ROLE: sandbox
      AI4S_TOOL_HOST: 0.0.0.0
      AI4S_TOOL_PORT: 1602
      AI4S_TOOL_WORKERS: 1
      FILE_SAVE_PATH: /data/skilloutput
      FILE_SERVER_URL: ${PUBLIC_TOOL_URL:-http://localhost:3000/tool}/v1/file_tool
      FILE_SERVER_INTERNAL_URL: http://ai4s-tool:1601/v1/file_tool
      SQLITE_DB_PATH: /data/autobots.db
      SQLITE_PATH: /data/mrag_sqlite.db
      LOG_PATH: /data/logs/ai4s-sandbox.log
    volumes:
      - ai4s-data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:1602/docs', timeout=3)
      interval: 10s
      timeout: 5s
      retries: 12

  ai4s-tool:
    build:
      context: .
      dockerfile: Dockerfile
      target: ai4s-tool
    restart: unless-stopped
    env_file:
      - ./ai4s-tool/.env
    environment:
      ENV: prod
      AI4S_TOOL_ROLE: api
      AI4S_TOOL_HOST: 0.0.0.0
      AI4S_TOOL_PORT: 1601
      AI4S_TOOL_WORKERS: ${TOOL_WORKERS:-3}
      AI4S_SANDBOX_URL: http://ai4s-sandbox:1602
      FILE_SAVE_PATH: /data/skilloutput
      FILE_SERVER_URL: ${PUBLIC_TOOL_URL:-http://localhost:3000/tool}/v1/file_tool
      FILE_SERVER_INTERNAL_URL: http://ai4s-tool:1601/v1/file_tool
      SQLITE_DB_PATH: /data/autobots.db
      SQLITE_PATH: /data/mrag_sqlite.db
      LOG_PATH: /data/logs/ai4s-tool.log
    volumes:
      - ai4s-data:/data
    depends_on:
      ai4s-sandbox:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:1601/docs', timeout=3)
      interval: 10s
      timeout: 5s
      retries: 12

  ai4s-backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    restart: unless-stopped
    env_file:
      - ./ai4s-tool/.env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ai-agent-station}
      MYSQL_USER: ${MYSQL_USER:-ai4s}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      AI4S_TOOL_BASE_URL: http://ai4s-tool:1601
      WORKSPACE_ROOT: /data/skilloutput
      SKILL_DIR: /app/runtime/skills
    volumes:
      - ai4s-data:/data
      - ai4s-data:/app/data
    depends_on:
      mysql:
        condition: service_healthy
      ai4s-tool:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend
      args:
        SERVICE_BASE_URL: ${SERVICE_BASE_URL:-}
        AI4S_TOOL_BASE_URL: ${AI4S_TOOL_BASE_URL:-/tool}
        VITE_Mrag_TOOL_URL: ${VITE_Mrag_TOOL_URL:-/tool}
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:80"
    depends_on:
      - ai4s-backend
      - ai4s-tool

volumes:
  mysql-data:
  ai4s-data:
